# Cloude Wars settings. New Bedwars' own settings stay in config.yml.
# Messages use & color codes.

# The team colors Cloude Wars supports, by the names /bw createTeam takes. /bw createTeam refuses other colors
# (an empty list allows every color). Arenas that already have other colors still load.
team-colors: [white, black, red, orange, yellow, lime, blue, purple]

# Random team colors: when a game starts, every team gets a different random color from team-colors, and team names
# on screen follow the color ("Lime"). The colors an arena was set up with only number its teams (see team-numbers).
random-team-colors: true

# The wood type of each team color (keys as in team-colors). Oak planks bought in the shop come as the buyer's
# team planks, e.g. red buys mangrove planks.
team-wood:
  white: pale_oak
  black: dark_oak
  red: mangrove
  orange: acacia
  yellow: bamboo
  lime: jungle
  blue: warped
  purple: crimson

# Map maker team blocks: while building an arena in setup mode, place a block whose name starts with #<team>#
# (rename it in an anvil, e.g. "#1#red wall#"). When a game starts it becomes that team's version: white wool,
# terracotta, concrete, glass, beds... take the team color, oak blocks (planks, stairs, logs...) the team's wood.
# Team numbers get their colors from this list in order: team 1 = the first color, team 2 the second, ...
team-numbers: [red, blue, lime, yellow, orange, purple, white, black]

proxy:
  # Run this server as a game server behind a Velocity proxy: players who connect go straight into the arena
  # (its waiting lobby first), and go back to the lobby server when the game ends or they leave.
  # Players with the permission cloudewars.proxy.admin (ops by default) are not moved: they join manually.
  enabled: false
  # The arena players are put into (a name from /bw arena list)
  arena: mini
  # The lobby server's name in the proxy's velocity.toml [servers] section
  lobby-server: lobby

trims:
  # Players pick a trim pattern for each armor piece with /bw trim; the trim material comes from their team color.
  # Keys are team colors as typed in /bw createTeam. A team whose color is not listed gets no trims.
  materials:
    white: quartz
    black: netherite
    red: redstone
    orange: resin
    yellow: gold
    lime: emerald
    blue: lapis
    purple: amethyst

# Map maker symmetry: build one quarter of a map and let Cloude Wars copy it to the other three, turned around the
# map's middle (the corner between blocks at x 0, z 0, where /bw arena create and /bw arena setup put you).
#   /bw setBuildSymmetry quarter nomiddle [size]  (setup mode) the quarter you stand in becomes yours; the other three
#                                                 get a floor, so you can see where your quarter ends
#   /bw syncSymmetry                              copies your quarter (every height) to the other three: blocks turn
#                                                 with the map (stairs, beds, logs...), chests and signs keep their
#                                                 contents, and team blocks go to the next teams (#1# -> #2#, #3#, #4#;
#                                                 with #1# and #2# in your quarter: #3#/#4#, #5#/#6#, #7#/#8#)
symmetry:
  # Quarter size in blocks when the command gives none: each quarter is size x size, the whole map 2*size x 2*size
  default-size: 64
  # The floor laid in the other three quarters (it only fills air, and syncSymmetry replaces it with your copies)
  marker-block: terracotta
  marker-y: 64

# The snow golem from the shop's Misc page (a snow golem egg, 5 gold by default; price and page are set in
# data/items.yml and the shop file). It throws snowballs at enemies that knock them back, never hits its own team,
# and when it falls into the void it comes back next to its owner with the same health.
snow-golem:
  # Walking speed compared to a normal snow golem (1 = normal)
  speed: 1.5
  # Snowballs per second (a normal snow golem throws 1)
  snowballs-per-second: 5
  # How hard each snowball pushes an enemy (0.4 = like a hit, 0 = no push)
  knockback: 0.4

# {piece} = helmet/chestplate/leggings/boots, {trim} = the trim pattern, {trims} = every pattern,
# {colors} = the team colors from team-colors, {team} = a team number, {max} = the highest team number (or size),
# {quarter} = the build quarter, {x}/{z} = its block range, {block}/{y} = the floor, {blocks} = changed blocks,
# {teamblocks} = copied team blocks, {count} = team blocks left out, {percent} = how much is copied
messages:
  team-block-marked: "&7Team &e{team} &7block"
  team-block-unmarked: "&7Removed the team &e{team} &7block"
  team-block-no-variant: "&cThis block has no team version, so it was not marked."
  team-block-no-team: "&cThere is no team {team}: team numbers go from 1 to {max}."
  team-color-not-allowed: "&cCloude Wars only supports these team colors: {colors}"
  proxy-arena-unavailable: "&cThis arena is not available right now, sending you back to the lobby."
  proxy-game-running: "&cA game is already running here, sending you back to the lobby."
  symmetry-usage: "&cUsage: /bw setBuildSymmetry quarter nomiddle [size]"
  symmetry-not-available: "&cOnly 'quarter nomiddle' is available for now."
  symmetry-bad-size: "&cThe size must be a whole number from 1 to {max}."
  symmetry-set: "&aYour quarter is the &e{quarter} &aone (x {x}, z {z}). The other three got a {block} floor at y {y}. Copy your quarter with &e/bw syncSymmetry&a."
  symmetry-none: "&cThis arena has no build symmetry yet: start with /bw setBuildSymmetry quarter nomiddle [size]"
  symmetry-busy: "&cYour quarter is already being copied."
  symmetry-progress: "&7Copying your quarter... &e{percent}%"
  symmetry-synced: "&aCopied your quarter to the other three: {blocks} blocks changed, {teamblocks} team blocks."
  symmetry-team-blocks-skipped: "&c{count} team block copies were left out: there is no team above {max}."
  trim-set: "&aYour {piece} trim is now &e{trim}&a."
  trim-removed: "&aRemoved the trim from your {piece}."
  trim-usage: "&cUsage: /bw trim <helmet|chestplate|leggings|boots> <trim|none>"
  trim-unknown: "&cThere is no trim called '{trim}'. Trims: {trims}"
