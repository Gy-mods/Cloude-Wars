# Cloude Wars settings. New Bedwars' own settings stay in config.yml.
# Messages use & color codes.

# The team colors Cloude Wars supports, by the names /bw createTeam takes. /bw createTeam refuses other colors
# (an empty list allows every color). Arenas that already have other colors still load.
team-colors: [white, black, red, orange, yellow, lime, blue, purple]

# The wood type of each team color (keys as in team-colors). Oak planks bought in the shop come as the buyer's
# team planks, e.g. red buys mangrove planks.
team-wood:
  white: pale_oak
  black: dark_oak
  red: mangrove
  orange: acacia
  yellow: bamboo
  lime: jungle
  blue: warped
  purple: crimson

# Map maker team blocks: while building an arena in setup mode, place a block whose name starts with #<team>#
# (rename it in an anvil, e.g. "#1#red wall#"). When a game starts it becomes that team's version: white wool,
# terracotta, concrete, glass, beds... take the team color, oak blocks (planks, stairs, logs...) the team's wood.
# Team numbers get their colors from this list in order: team 1 = the first color, team 2 the second, ...
team-numbers: [red, blue, lime, yellow, orange, purple, white, black]

proxy:
  # Run this server as a game server behind a Velocity proxy: players who connect go straight into the arena
  # (its waiting lobby first), and go back to the lobby server when the game ends or they leave.
  # Players with the permission cloudewars.proxy.admin (ops by default) are not moved: they join manually.
  enabled: false
  # The arena players are put into (a name from /bw arena list)
  arena: mini
  # The lobby server's name in the proxy's velocity.toml [servers] section
  lobby-server: lobby

trims:
  # Players pick a trim pattern for each armor piece with /bw trim; the trim material comes from their team color.
  # Keys are team colors as typed in /bw createTeam. A team whose color is not listed gets no trims.
  materials:
    white: quartz
    black: netherite
    red: redstone
    orange: resin
    yellow: gold
    lime: emerald
    blue: lapis
    purple: amethyst

# {piece} = helmet/chestplate/leggings/boots, {trim} = the trim pattern, {trims} = every pattern,
# {colors} = the team colors from team-colors, {team} = a team number, {max} = the highest team number
messages:
  team-block-marked: "&7Team &e{team} &7block"
  team-block-unmarked: "&7Removed the team &e{team} &7block"
  team-block-no-variant: "&cThis block has no team version, so it was not marked."
  team-block-no-team: "&cThere is no team {team}: team numbers go from 1 to {max}."
  team-color-not-allowed: "&cCloude Wars only supports these team colors: {colors}"
  proxy-arena-unavailable: "&cThis arena is not available right now, sending you back to the lobby."
  proxy-game-running: "&cA game is already running here, sending you back to the lobby."
  trim-set: "&aYour {piece} trim is now &e{trim}&a."
  trim-removed: "&aRemoved the trim from your {piece}."
  trim-usage: "&cUsage: /bw trim <helmet|chestplate|leggings|boots> <trim|none>"
  trim-unknown: "&cThere is no trim called '{trim}'. Trims: {trims}"
