name: CloudeWars
version: '${project.version}'
main: me.sirsz.cloudewars.CloudeWars
api-version: '1.21'
authors: [sirsz]
depend: [NewBedwars]
description: Cloude Wars - an addon for New Bedwars by l299l (trims, team wood, team blocks, symmetry, snow golem)
website: https://github.com/Gy-mods/Cloude-Wars
commands:
  cloudewars:
    description: Cloude Wars admin commands
    usage: /<command> reload
    permission: cloudewars.admin
permissions:
  cloudewars.admin:
    description: Reload Cloude Wars with /cloudewars reload.
    default: op
